id           = "murderaxolotl/governorState"
name         = "Governor State"
version      = "1.2.1"
min_noctalia = "5.0.0"
plugin_api   = 3
author       = "MurderAxolotl"
icon         = "puzzle"
description  = "Provides an indicator for the current governor"

[[widget]]
id = "state_indicator"
entry = "state_indicator.luau"

	[[widget.setting]]
	key   = "execUseSudo"
	type  = "bool"
	label_key = "settings.us.label"
	description_key = "settings.us.description"
	default = false

	[[widget.setting]]
	key   = "setNoctaliaPowerState"
	type  = "bool"
	label_key = "settings.snps.label"
	description_key = "settings.snps.description"
	default = false
